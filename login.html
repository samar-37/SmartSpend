<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Login — Smart Expense Tracker</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-container">
    <h2>Welcome back</h2>
    <form id="loginForm">
      <label>Email <input id="loginEmail" type="email" required></label>
      <label>Password <input id="loginPassword" type="password" required></label>
      <div style="display:flex;gap:8px;align-items:center">
        <button type="submit" class="btn">Login</button>
        <button id="demoBtn" type="button" class="btn btn-alt">Demo user</button>
      </div>
    </form>
    <p class="muted">No account? <a href="signup.html">Sign up</a></p>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
